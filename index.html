<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jean Michel Lookup</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #1e88e5 100%); min-height: 100vh; padding: 20px; }
        .wrapper { max-width: 900px; margin: 0 auto; }
        header { background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 40px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); text-align: center; }
        h1 { font-size: 32px; color: #0d47a1; margin-bottom: 10px; }
        .subtitle { font-size: 16px; color: #666; }
        .search-section { background: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
        .search-box { display: flex; gap: 12px; margin-bottom: 15px; }
        input { flex: 1; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        input:focus { outline: none; border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21,101,192,0.1); }
        button { padding: 14px 32px; background: linear-gradient(135deg, #1565c0 0%, #1e88e5 100%); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { transform: translateY(-2px); }
        .results-section { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); min-height: 200px; }
        .suppliers { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .supplier-card { border: 2px solid #e3f2fd; border-radius: 10px; padding: 20px; background: #f8f9fa; }
        .supplier-name { font-size: 18px; font-weight: 700; color: #0d47a1; margin-bottom: 15px; }
        .product { background: white; padding: 12px; border-radius: 6px; border-left: 3px solid #1565c0; margin-bottom: 8px; }
        .product-code { font-weight: 700; color: #0d47a1; }
        footer { text-align: center; color: rgba(255, 255, 255, 0.8); margin-top: 40px; font-size: 13px; }
        a { color: rgba(255,255,255,0.8); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
     
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>🔍 Jean Michel Lookup</h1>
            <p class="subtitle">Moteur de recherche — RacMet, SERTIsteel, Oventrop, FIP</p>
                        <p style="margin-top:10px; font-size:12px;">
                <a href="/admin.html" style="color: #0d47a1; text-decoration: none;">🔧 Admin Interface</a>
            </p>
        </header>
        <div class="search-section">
            <div class="search-box">
                <input id="searchInput" placeholder="Ex: VKD, IN316L15, 1011462..." autocomplete="off">
                <button onclick="search()">Chercher</button>
            </div>
        </div>
        <div class="results-section">
            <div id="loading" style="display:none; text-align:center; color:#1565c0;">Recherche en cours...</div>
            <div id="error" style="display:none; background:#ffebee; color:#c62828; padding:15px; border-radius:8px; border-left:4px solid #c62828;"></div>
            <div id="results"></div>
        </div>
        <footer>
            <p>Jean Michel Lookup • Données à jour • Recherche instantanée</p>
            <p style="margin-top:10px;">
                <a href="/admin.html">🔧 Admin Interface</a>
            </p>
        </footer>
    </div>

    <script>
        const WORKER_URL = 'https://jean-michel-api.antonio-dev.workers.dev/';
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') search(); });
        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            try {
                const res = await fetch(WORKER_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query}) });
                const data = await res.json();
                let html = '<div class="suppliers">';
                for (const [supplier, products] of Object.entries(data)) {
                    html += `<div class="supplier-card"><div class="supplier-name">▶ ${supplier}</div>`;
                    products.forEach(p => { html += `<div class="product"><div class="product-code">${p.code}</div><div style="font-size:13px;color:#666;">${p.type || ''} ${p.diametre || ''}</div></div>`; });
                    html += '</div>';
                }
                html += '</div>';
                document.getElementById('results').innerHTML = html || '<div style="text-align:center;color:#999;">Aucun résultat</div>';
            } catch (err) { document.getElementById('error').textContent = 'Erreur: ' + err.message; document.getElementById('error').style.display = 'block'; }
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
