<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jean Michel Lookup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #faf9f5 0%, #fef8f3 100%);
            min-height: 100vh; 
            padding: 20px; 
            color: #2a2a2a;
        }
        .wrapper { max-width: 900px; margin: 0 auto; }
        header { 
            background: white; 
            border-radius: 16px; 
            padding: 50px 40px; 
            margin-bottom: 30px; 
            box-shadow: 0 2px 12px rgba(204, 120, 92, 0.08); 
            text-align: center; 
            border-top: 4px solid #cc785c;
        }
        h1 { 
            font-size: 42px; 
            color: #2a2a2a;
            margin-bottom: 12px; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header-links { 
            font-size: 12px; 
            margin-top: 20px; 
        }
        .btn-admin {
            padding: 10px 20px;
            background: #cc785c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(204, 120, 92, 0.2);
        }
        .btn-admin:hover {
            background: #b8674d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(204, 120, 92, 0.3);
        }
        .subtitle { 
            font-size: 16px; 
            color: #666; 
            font-weight: 500;
        }
        .search-section { 
            background: white; 
            border-radius: 16px; 
            padding: 40px; 
            margin-bottom: 30px; 
            box-shadow: 0 2px 12px rgba(204, 120, 92, 0.08); 
        }
        .search-box { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        textarea { 
            padding: 14px; 
            border: 2px solid #e8e0d5; 
            border-radius: 10px; 
            font-size: 14px; 
            font-family: 'Courier New', monospace; 
            resize: vertical; 
            min-height: 100px;
            background: #faf9f5;
            transition: all 0.3s;
        }
        textarea:focus { 
            outline: none; 
            border-color: #cc785c; 
            box-shadow: 0 0 0 3px rgba(204, 120, 92, 0.1);
            background: white;
        }
        button { 
            padding: 14px 32px; 
            background: linear-gradient(135deg, #cc785c 0%, #d88d6d 100%); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(204, 120, 92, 0.3); 
            transition: all 0.3s;
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(204, 120, 92, 0.4); 
        }
        .hints { 
            font-size: 13px; 
            color: #999; 
            margin-top: 12px; 
        }
        .results-section { 
            background: white; 
            border-radius: 16px; 
            padding: 40px; 
            box-shadow: 0 2px 12px rgba(204, 120, 92, 0.08); 
            min-height: 200px; 
        }
        .loading { 
            text-align: center; 
            padding: 40px 20px; 
            color: #cc785c; 
            font-size: 16px; 
        }
        .error { 
            background: #fff5f3; 
            color: #b8674d; 
            padding: 16px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            border-left: 4px solid #cc785c; 
            font-size: 15px; 
        }
        .suppliers { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 24px; 
        }
        .supplier-section { 
            border: 2px solid #e8e0d5; 
            border-radius: 12px; 
            overflow: hidden;
            background: #faf9f5;
        }
        .supplier-header {
            background: #cc785c;
            color: white;
            padding: 16px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .supplier-count {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 4px;
        }
        .products-list {
            padding: 16px;
        }
        .product-row {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid #e8e0d5;
            align-items: flex-start;
            font-size: 13px;
            transition: background 0.2s;
        }
        .product-row:hover {
            background: white;
        }
        .product-row:last-child {
            border-bottom: none;
        }
        .product-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-top: 2px;
            accent-color: #cc785c;
            flex-shrink: 0;
        }
        .product-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 16px;
            align-items: center;
        }
        .product-code {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: #cc785c;
        }
        .product-name {
            color: #666;
        }
        .copy-button {
            padding: 10px 16px;
            background: #cc785c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: all 0.3s;
            box-shadow: 0 2px 6px rgba(204, 120, 92, 0.2);
        }
        .copy-button:hover {
            background: #b8674d;
            box-shadow: 0 2px 8px rgba(204, 120, 92, 0.3);
        }
        .copy-button.copied {
            background: #4caf50;
        }
        .empty { 
            text-align: center; 
            color: #999; 
            padding: 40px 20px; 
            font-size: 16px; 
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>🔍 Jean Michel Lookup</h1>
            <p class="subtitle">Moteur de recherche — RacMet, SERTIsteel, Oventrop, FIP</p>
            <div class="header-links">
                <button class="btn-admin" onclick="window.location.href='/admin.html'">🔧 Admin Interface</button>
            </div>
        </header>

        <div class="search-section">
            <div class="search-box">
                <textarea 
                    id="searchInput" 
                    placeholder="Colle tes références (espaces, virgules ou retour à la ligne)&#10;Ex: VKD IN316L15 1011462 ou VKD, IN316L15, 1011462"
                    autocomplete="off"
                ></textarea>
                <button onclick="search()">Chercher</button>
            </div>
            <div class="hints">
                💡 Formats acceptés : espaces, virgules ou retours à la ligne
            </div>
        </div>

        <div class="results-section">
            <div id="loading" style="display:none; text-align:center; color:#cc785c;">Recherche en cours...</div>
            <div id="error" style="display:none;"></div>
            <div id="results"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://jean-michel-api.antonio-dev.workers.dev/';
        
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) search();
        });

        async function search() {
            const rawInput = document.getElementById('searchInput').value.trim();
            if (!rawInput) {
                showError('Tape ou colle des références');
                return;
            }

            const queries = rawInput
                .split(/[\n,\s]+/)
                .map(q => q.trim())
                .filter(q => q.length > 0);

            if (queries.length === 0) {
                showError('Aucune référence valide');
                return;
            }

            hideError();
            showLoading();
            clearResults();

            try {
                const allResults = {};

                for (const query of queries) {
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query })
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();

                    for (const [supplier, products] of Object.entries(data)) {
                        if (!allResults[supplier]) allResults[supplier] = [];
                        if (Array.isArray(products)) {
                            allResults[supplier].push(...products);
                        }
                    }
                }

                displayResults(allResults);
            } catch (err) {
                showError(`Erreur: ${err.message}`);
            } finally {
                hideLoading();
            }
        }

        function displayResults(data) {
            const unique = Array.from(new Map(products.map(p => [p.code, p])).values())
    .sort((a, b) => {
        const nameA = (a.type || a.diametre || 'N/A').toLowerCase();
        const nameB = (b.type || b.diametre || 'N/A').toLowerCase();
        return nameA.localeCompare(nameB);
    });

            if (Object.keys(data).length === 0) {
                resultsDiv.innerHTML = '<div class="empty">Aucun résultat trouvé</div>';
                return;
            }

            let html = '<div class="suppliers">';

            for (const [supplier, products] of Object.entries(data)) {
                let unique = Array.from(new Map(products.map(p => [p.code, p])).values());
unique = unique.sort((a, b) => {
    const nameA = (a.type || a.diametre || 'N/A').toLowerCase();
    const nameB = (b.type || b.diametre || 'N/A').toLowerCase();
    return nameA.localeCompare(nameB);
});
                
                html += `<div class="supplier-section">
                    <div class="supplier-header">
                        ${supplier}
                        <span class="supplier-count">${unique.length}</span>
                    </div>
                    <div class="products-list">`;

                unique.forEach((product, index) => {
                    const designation = product.type || product.diametre || 'N/A';
                    const checkboxId = `${supplier}-${index}`;
                    html += `<div class="product-row">
                        <input 
                            type="checkbox" 
                            class="product-checkbox supplier-${supplier.replace(/\s/g, '_')}" 
                            id="${checkboxId}"
                            data-code="${product.code}"
                            data-name="${designation}"
                            checked
                        />
                        <div class="product-content">
                            <div class="product-code">${product.code}</div>
                            <div class="product-name">${designation}</div>
                        </div>
                    </div>`;
                });

                html += `<button class="copy-button" onclick="copySupplierList('${supplier}')">📋 Copier la sélection</button>
                    </div>
                </div>`;
            }

            html += '</div>';
            resultsDiv.innerHTML = html;
        }

        function copySupplierList(supplier) {
            const checkboxes = document.querySelectorAll(`.supplier-${supplier.replace(/\s/g, '_')}:checked`);
            
            if (checkboxes.length === 0) {
                alert('Sélectionne au moins un produit');
                return;
            }

            const text = Array.from(checkboxes)
                .map(cb => `${cb.dataset.code} - ${cb.dataset.name}`)
                .join('\n');
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                btn.textContent = '✅ Copié !';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Copier la sélection';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function showLoading() { document.getElementById('loading').style.display = 'block'; }
        function hideLoading() { document.getElementById('loading').style.display = 'none'; }
        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.className = 'error';
            errorDiv.style.display = 'block';
        }
        function hideError() { document.getElementById('error').style.display = 'none'; }
        function clearResults() { document.getElementById('results').innerHTML = ''; }
    </script>
</body>
</html>
