<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jean Michel Lookup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 14px;
            margin: 20px 0;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 14px;
            border-left: 4px solid #c33;
        }
        
        .results {
            margin-top: 30px;
        }
        
        .supplier {
            margin-bottom: 25px;
        }
        
        .supplier-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            margin-bottom: 10px;
        }
        
        .product {
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 13px;
            border-left: 3px solid #667eea;
        }
        
        .product-code {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .product-info {
            color: #666;
            font-size: 12px;
        }
        
        .empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Jean Michel Lookup</h1>
        <p class="subtitle">Recherche de références produits</p>
        
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Ex: IN316L15, VKD, FK300..."
                autocomplete="off"
            >
            <button onclick="search()">Chercher</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">Recherche en cours...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="results" class="results"></div>
    </div>

    <script>
        const WORKER_URL = 'https://jean-michel-api.antonio-dev.workers.dev/';
        
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });
        
        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                showError('Veuillez entrer une référence');
                return;
            }
            
            hideError();
            showLoading();
            clearResults();
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    hideLoading();
                    return;
                }
                
                displayResults(data);
            } catch (err) {
                showError(`Erreur: ${err.message}`);
            } finally {
                hideLoading();
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            if (Object.keys(data).length === 0) {
                resultsDiv.innerHTML = '<div class="empty">Aucun résultat trouvé</div>';
                return;
            }
            
            let html = '';
            for (const [supplier, products] of Object.entries(data)) {
                html += `<div class="supplier">
                    <div class="supplier-name">${supplier}</div>`;
                
                if (Array.isArray(products)) {
                    products.forEach(product => {
                        html += `<div class="product">
                            <div class="product-code">${product.code || 'N/A'}</div>
                            <div class="product-info">
                                ${product.type ? `Type: ${product.type} | ` : ''}
                                ${product.diametre ? `Ø ${product.diametre} | ` : ''}
                                ${product.longueur ? `L ${product.longueur}` : ''}
                            </div>
                        </div>`;
                    });
                }
                
                html += '</div>';
            }
            
            resultsDiv.innerHTML = html;
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('error').style.display = 'none';
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
    </script>
</body>
</html>
