<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Jean Michel Lookup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #0d47a1 0%, #1e88e5 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header-left .subtitle {
            opacity: 0.9;
            font-size: 14px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-admin {
            background: white;
            color: #0d47a1;
            font-weight: 700;
        }

        .btn-admin:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1565c0;
            color: white;
        }

        .btn-primary:hover {
            background: #0d47a1;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .products-section {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            background: #f5f5f5;
            padding: 15px 20px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table thead {
            background: #f9f9f9;
            border-bottom: 2px solid #e0e0e0;
        }

        .products-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .products-table th:hover {
            background: #f0f0f0;
        }

        .products-table th.sortable::after {
            content: '↕';
            position: absolute;
            right: 5px;
            opacity: 0.3;
        }

        .products-table th.sorted-asc::after {
            content: '↑';
            opacity: 1;
            color: #1565c0;
        }

        .products-table th.sorted-desc::after {
            content: '↓';
            opacity: 1;
            color: #1565c0;
        }

        .products-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .products-table tr:hover {
            background: #fafafa;
        }

        .products-table td.actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f44336;
            color: white;
        }

        .btn-small:hover {
            background: #d32f2f;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #999;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #1565c0;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>🔧 Admin - Jean Michel Lookup</h1>
                <p class="subtitle">Gérer les références produits (charge depuis Worker + localStorage)</p>
            </div>
            <div class="header-buttons">
                <button class="btn-icon btn-back" onclick="goBack()">← Retour</button>
                <button class="btn-icon btn-admin" onclick="goToSearch()">🔍 Rechercher</button>
            </div>
        </header>

        <div id="alert" class="alert" style="display: none;"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total produits</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="racmetCount">0</div>
                <div class="stat-label">RacMet</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="sertistCount">0</div>
                <div class="stat-label">SERTIsteel</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="oventropCount">0</div>
                <div class="stat-label">Oventrop</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="fipCount">0</div>
                <div class="stat-label">FIP</div>
            </div>
        </div>

        <div class="controls">
            <div class="form-row">
                <input type="text" id="code" placeholder="Code (ex: VKD, IN316L15)" />
                <input type="text" id="type" placeholder="Type (ex: Vanne Dual Block)" />
                <input type="text" id="diametre" placeholder="Diamètre (ex: DN65)" />
                <select id="fournisseur">
                    <option value="">-- Fournisseur --</option>
                    <option value="RacMet">RacMet</option>
                    <option value="SERTIsteel">SERTIsteel</option>
                    <option value="Oventrop">Oventrop</option>
                    <option value="FIP">FIP</option>
                </select>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="addProduct()">➕ Ajouter (localStorage)</button>
                <button class="btn-secondary" onclick="exportJSON()">📥 Exporter (JSON)</button>
            </div>
        </div>

        <div class="products-section">
            <div class="section-header">
                <span>Produits (Worker + localStorage)</span>
                <span id="count" style="font-size: 12px; font-weight: normal; color: #999;">0 items</span>
            </div>
            <table class="products-table">
                <thead>
                    <tr>
                        <th class="sortable" onclick="sort('code')">Code</th>
                        <th class="sortable" onclick="sort('type')">Type</th>
                        <th class="sortable" onclick="sort('diametre')">Diamètre</th>
                        <th class="sortable" onclick="sort('fournisseur')">Fournisseur</th>
                        <th>Source</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsBody">
                    <tr><td colspan="6" class="empty">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://jean-michel-api.antonio-dev.workers.dev/';
        let products = [];
        let sortColumn = null;
        let sortAsc = true;

        async function loadAll() {
            await loadProductsFromWorker();
            loadProductsFromLocalStorage();
            render();
        }

        async function loadProductsFromWorker() {
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: '' })
                });
                
                const data = await response.json();
                
                for (const [fournisseur, prods] of Object.entries(data)) {
                    if (Array.isArray(prods)) {
                        prods.forEach(p => {
                            products.push({
                                code: p.code,
                                type: p.type || '',
                                diametre: p.diametre || '',
                                fournisseur: fournisseur,
                                source: 'Worker'
                            });
                        });
                    }
                }
            } catch (err) {
                showAlert(`⚠️ Erreur Worker: ${err.message}`, 'error');
            }
        }

        function loadProductsFromLocalStorage() {
            const local = JSON.parse(localStorage.getItem('products')) || [];
            local.forEach(p => {
                products.push({
                    ...p,
                    source: 'Local'
                });
            });
        }

        function saveProducts() {
            const local = products.filter(p => p.source === 'Local');
            localStorage.setItem('products', JSON.stringify(local));
        }

        function addProduct() {
            const code = document.getElementById('code').value.trim();
            const type = document.getElementById('type').value.trim();
            const diametre = document.getElementById('diametre').value.trim();
            const fournisseur = document.getElementById('fournisseur').value;

            if (!code || !type || !diametre || !fournisseur) {
                showAlert('Remplis tous les champs', 'error');
                return;
            }

            products.push({ code, type, diametre, fournisseur, source: 'Local' });
            saveProducts();
            
            document.getElementById('code').value = '';
            document.getElementById('type').value = '';
            document.getElementById('diametre').value = '';
            document.getElementById('fournisseur').value = '';

            showAlert('✅ Produit ajouté', 'success');
            render();
        }

        function deleteProduct(index) {
            if (confirm('Confirmer la suppression ?')) {
                const p = products[index];
                if (p.source === 'Worker') {
                    showAlert('❌ Impossible de supprimer un produit du Worker', 'error');
                    return;
                }
                products.splice(index, 1);
                saveProducts();
                render();
            }
        }

        function exportJSON() {
            const json = JSON.stringify(products, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'products.json';
            a.click();
            showAlert('✅ JSON téléchargé', 'success');
        }

        function sort(column) {
            if (sortColumn === column) {
                sortAsc = !sortAsc;
            } else {
                sortColumn = column;
                sortAsc = true;
            }

            products.sort((a, b) => {
                const aVal = a[column].toLowerCase();
                const bVal = b[column].toLowerCase();
                const cmp = aVal.localeCompare(bVal);
                return sortAsc ? cmp : -cmp;
            });

            render();
        }

        function showAlert(msg, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = msg;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => alertDiv.style.display = 'none', 3000);
        }

        function goBack() {
            window.location.href = '/';
        }

        function goToSearch() {
            window.location.href = '/';
        }

        function render() {
            const tbody = document.getElementById('productsBody');
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">Aucun produit</td></tr>';
                document.getElementById('count').textContent = '0 items';
                updateStats();
                return;
            }

            tbody.innerHTML = products.map((p, i) => `
                <tr>
                    <td><strong>${p.code}</strong></td>
                    <td>${p.type}</td>
                    <td>${p.diametre}</td>
                    <td><strong>${p.fournisseur}</strong></td>
                    <td><small style="color:#999;">${p.source}</small></td>
                    <td class="actions">
                        ${p.source === 'Local' ? `<button class="btn-small" onclick="deleteProduct(${i})">Supprimer</button>` : '<small style="color:#999;">n/a</small>'}
                    </td>
                </tr>
            `).join('');

            document.getElementById('count').textContent = `${products.length} items`;
            updateStats();
            updateSortIndicators();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = products.length;
            document.getElementById('racmetCount').textContent = products.filter(p => p.fournisseur === 'RacMet').length;
            document.getElementById('sertistCount').textContent = products.filter(p => p.fournisseur === 'SERTIsteel').length;
            document.getElementById('oventropCount').textContent = products.filter(p => p.fournisseur === 'Oventrop').length;
            document.getElementById('fipCount').textContent = products.filter(p => p.fournisseur === 'FIP').length;
        }

        function updateSortIndicators() {
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                const col = th.textContent.toLowerCase();
                if (sortColumn === 'code' && col.includes('code')) {
                    th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
                } else if (sortColumn === 'type' && col.includes('type')) {
                    th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
                } else if (sortColumn === 'diametre' && col.includes('diamètre')) {
                    th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
                } else if (sortColumn === 'fournisseur' && col.includes('fournisseur')) {
                    th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
                }
            });
        }

        loadAll();
    </script>
</body>
</html>
