<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Jean Michel Lookup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
<footer>
    <p>Jean Michel Lookup • Données à jour • Recherche instantanée</p>
    <p style="margin-top: 10px; font-size: 12px;">
        <a href="/admin.html" style="color: rgba(255,255,255,0.8); text-decoration: none;">🔧 Admin Interface</a>
    </p>
</footer>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #0d47a1 0%, #1e88e5 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 14px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1565c0;
            color: white;
        }

        .btn-primary:hover {
            background: #0d47a1;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #d32f2f;
            color: white;
        }

        .btn-danger:hover {
            background: #b71c1c;
        }

        .products-section {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            background: #f5f5f5;
            padding: 15px 20px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table thead {
            background: #f9f9f9;
            border-bottom: 2px solid #e0e0e0;
        }

        .products-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
        }

        .products-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .products-table tr:hover {
            background: #fafafa;
        }

        .products-table td.actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-edit {
            background: #2196f3;
            color: white;
        }

        .btn-edit:hover {
            background: #1976d2;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #d32f2f;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #999;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #1565c0;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Admin - Jean Michel Lookup</h1>
            <p class="subtitle">Gérer les références produits</p>
        </header>

        <div id="alert" class="alert" style="display: none;"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total produits</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="racmetCount">0</div>
                <div class="stat-label">RacMet</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="sertistCount">0</div>
                <div class="stat-label">SERTIsteel</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="oventropCount">0</div>
                <div class="stat-label">Oventrop</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="fipCount">0</div>
                <div class="stat-label">FIP</div>
            </div>
        </div>

        <div class="controls">
            <div class="form-row">
                <input type="text" id="code" placeholder="Code (ex: VKD, IN316L15)" />
                <input type="text" id="type" placeholder="Type (ex: Vanne Dual Block)" />
                <input type="text" id="diametre" placeholder="Diamètre (ex: DN65)" />
                <select id="fournisseur">
                    <option value="">-- Fournisseur --</option>
                    <option value="RacMet">RacMet</option>
                    <option value="SERTIsteel">SERTIsteel</option>
                    <option value="Oventrop">Oventrop</option>
                    <option value="FIP">FIP</option>
                </select>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="addProduct()">➕ Ajouter</button>
                <button class="btn-secondary" onclick="exportJSON()">📥 Exporter (JSON)</button>
                <button class="btn-secondary" onclick="clearAll()">🗑️ Tout supprimer</button>
            </div>
        </div>

        <div class="products-section">
            <div class="section-header">
                <span>Produits</span>
                <span id="count" style="font-size: 12px; font-weight: normal; color: #999;">0 items</span>
            </div>
            <table class="products-table">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Type</th>
                        <th>Diamètre</th>
                        <th>Fournisseur</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsBody">
                    <tr><td colspan="5" class="empty">Aucun produit. Ajoutes-en un d'abord.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('products')) || [
            { code: "VKD", type: "Vanne Dual Block", diametre: "DN65-110", fournisseur: "FIP" },
            { code: "IN316L15", type: "Tube Inox 316L 3m", diametre: "DN65", fournisseur: "RacMet" },
            { code: "1011462", type: "HYDROCONTROL V", diametre: "DN65", fournisseur: "Oventrop" },
        ];

        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        function addProduct() {
            const code = document.getElementById('code').value.trim();
            const type = document.getElementById('type').value.trim();
            const diametre = document.getElementById('diametre').value.trim();
            const fournisseur = document.getElementById('fournisseur').value;

            if (!code || !type || !diametre || !fournisseur) {
                showAlert('Remplis tous les champs', 'error');
                return;
            }

            products.push({ code, type, diametre, fournisseur });
            saveProducts();
            
            document.getElementById('code').value = '';
            document.getElementById('type').value = '';
            document.getElementById('diametre').value = '';
            document.getElementById('fournisseur').value = '';

            showAlert('✅ Produit ajouté', 'success');
            render();
        }

        function deleteProduct(index) {
            if (confirm('Confirmer la suppression ?')) {
                products.splice(index, 1);
                saveProducts();
                render();
            }
        }

        function exportJSON() {
            const json = JSON.stringify(products, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'products.json';
            a.click();
            showAlert('✅ JSON téléchargé', 'success');
        }

        function clearAll() {
            if (confirm('Supprimer TOUS les produits ? Cette action est irréversible !')) {
                products = [];
                saveProducts();
                render();
                showAlert('✅ Tous les produits supprimés', 'success');
            }
        }

        function showAlert(msg, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = msg;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => alertDiv.style.display = 'none', 3000);
        }

        function render() {
            const tbody = document.getElementById('productsBody');
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">Aucun produit</td></tr>';
                document.getElementById('count').textContent = '0 items';
                updateStats();
                return;
            }

            tbody.innerHTML = products.map((p, i) => `
                <tr>
                    <td><strong>${p.code}</strong></td>
                    <td>${p.type}</td>
                    <td>${p.diametre}</td>
                    <td><strong>${p.fournisseur}</strong></td>
                    <td class="actions">
                        <button class="btn-small btn-delete" onclick="deleteProduct(${i})">Supprimer</button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('count').textContent = `${products.length} items`;
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = products.length;
            document.getElementById('racmetCount').textContent = products.filter(p => p.fournisseur === 'RacMet').length;
            document.getElementById('sertistCount').textContent = products.filter(p => p.fournisseur === 'SERTIsteel').length;
            document.getElementById('oventropCount').textContent = products.filter(p => p.fournisseur === 'Oventrop').length;
            document.getElementById('fipCount').textContent = products.filter(p => p.fournisseur === 'FIP').length;
        }

        render();
    </script>
</body>
</html>
